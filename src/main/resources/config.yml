settings:
  max-speed-level: 4
  max-range-level: 4
  default-transfer-ticks: 8
  default-transfer-amount: 1
  # Hard cap per scheduler run to prevent large installations from monopolizing the server thread.
  max-hoppers-per-run: 25

hopper-types:
  # Crop, mob, and ore hoppers use chunk radius range upgrades when enabled.
  enabled: true

crafting-recipes:
  # Controls the vanilla hopper crafting recipe.
  enabled: true

conversion:
  # Enable only while importing hoppers from existing world chunks. Disable after the first migration.
  enabled: false
  # Saved chunks are checked gradually so startup does not load entire worlds at once.
  chunks-per-second: 2

gui:
  title: "&d✦ Mytheria Hoppers ✦"

economy:
  provider: VAULT

speed-upgrades:

  1:
    transfer-ticks: 8
    transfer-amount: 1
    cost: 75

  2:
    transfer-ticks: 6
    transfer-amount: 1
    cost: 250

  3:
    transfer-ticks: 4
    transfer-amount: 1
    cost: 750

  4:
    transfer-ticks: 2
    transfer-amount: 1
    cost: 2500

range-upgrades:

  0:
    range: 0
    cost: 0

  1:
    range: 1
    cost: 150

  2:
    range: 2
    cost: 750

  3:
    range: 3
    cost: 2500

  4:
    range: 4
    cost: 6000

filter:
  unlock-cost: 750
  slot-cost: 75
  max-slots: 18

messages:

  prefix: "&d&lMytheria &5&lHoppers &8»"

  no-permission: "&cYou do not have permission."

  upgraded: "&aUpgrade purchased!"

  max-level: "&cThis upgrade is already maxed!"

  not-enough-money: "&cYou do not have enough money."

  reloaded: "&aConfiguration reloaded."
